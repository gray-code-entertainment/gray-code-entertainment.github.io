<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Checkout — Gray Code Entertainment</title>
<link rel="canonical" href="https://graycodeenterprise.net/checkout" />
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f4f4; color: #111; }
  header { background: #000; color: #fff; padding: 16px 20px; font-weight: 800; letter-spacing: 1px; font-size: 15px; }
  main { max-width: 560px; margin: 0 auto; padding: 72px 20px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { color: #555; line-height: 1.5; }
  a.checkout-link { display: inline-block; margin-top: 20px; background: #c9a227; color: #111; font-weight: 700; text-decoration: none; padding: 12px 24px; border-radius: 6px; }
  a.checkout-link:hover { background: #d9b73a; }
  #order-summary { margin-top: 28px; text-align: left; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; }
  #order-summary h2 { font-size: 18px; margin: 0 0 12px; }
  .summary-item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #eee; }
  .summary-item:first-of-type { border-top: 0; }
  .summary-item .item-name { font-weight: 700; color: #111; }
  .summary-item .item-detail { color: #555; font-size: 14px; }
  .summary-item .item-total { font-weight: 700; color: #111; white-space: nowrap; }
  .summary-total { display: flex; justify-content: space-between; gap: 12px; padding-top: 12px; margin-top: 8px; border-top: 2px solid #111; font-weight: 800; font-size: 18px; color: #111; }
</style>
</head>
<body>
<header>GRAY CODE ENTERPRISE</header>
<main>
  <h1>Taking you to checkout...</h1>
  <p id="status-line"></p>
  <section id="order-summary" aria-label="Order summary" hidden>
    <h2>Order summary</h2>
    <div id="summary-items"></div>
    <div class="summary-total"><span>Subtotal</span><span id="summary-subtotal"></span></div>
  </section>
  <p>If you are not redirected automatically, tap the button below.</p>
  <a class="checkout-link" id="manual-link" href="/store">Continue to checkout</a>
  <noscript><p><a href="/store">Continue to the store</a></p></noscript>
</main>
<script>
(function () {
  // Meta Commerce sends ?products=<id>:<qty>,<id>:<qty> — same format as
  // Meta's sample checkout controller. The old version redirected to the
  // first product's static Stripe payment link, which dropped everything
  // else. Instead, the full products list goes to the same Make webhook the
  // site cart uses, and the buyer is redirected to the Stripe Checkout
  // Session URL Make returns — so every item and quantity lands in one
  // checkout.
  var CHECKOUT_WEBHOOK_URL = "https://hook.us2.make.com/9g453ijur8psesoo6r18rnvflf4i3ma9";
  // NOTE: Meta's products param carries no size, so size is sent empty.
  // The payload shape otherwise matches the site cart exactly.
  // Meta's catalog uses one variant ID per size (item_group_id is the base
  // product). Each variant maps to its base product + that size. Names use
  // the EXACT catalog item titles ("The Last 7 T-Shirt - M"), which is what
  // Meta's checkout validation checks against — never the "(Size M)" form.
  // Base IDs (no size) still work exactly as before.
  var PRODUCTS = {
    "last7-tee":       { product: "last7-tee",    name: "The Last 7 T-Shirt",      price_id: "price_1UYuFRPPjEaGGXHQ5duaCcki", price_cents: 5000, size: "" },
    "last7-tee-xs":    { product: "last7-tee",    name: "The Last 7 T-Shirt - XS", price_id: "price_1UYuFRPPjEaGGXHQ5duaCcki", price_cents: 5000, size: "XS" },
    "last7-tee-s":     { product: "last7-tee",    name: "The Last 7 T-Shirt - S",  price_id: "price_1UYuFRPPjEaGGXHQ5duaCcki", price_cents: 5000, size: "S" },
    "last7-tee-m":     { product: "last7-tee",    name: "The Last 7 T-Shirt - M",  price_id: "price_1UYuFRPPjEaGGXHQ5duaCcki", price_cents: 5000, size: "M" },
    "last7-tee-l":     { product: "last7-tee",    name: "The Last 7 T-Shirt - L",  price_id: "price_1UYuFRPPjEaGGXHQ5duaCcki", price_cents: 5000, size: "L" },
    "last7-tee-xl":    { product: "last7-tee",    name: "The Last 7 T-Shirt - XL", price_id: "price_1UYuFRPPjEaGGXHQ5duaCcki", price_cents: 5000, size: "XL" },
    "last7-tee-2xl":   { product: "last7-tee",    name: "The Last 7 T-Shirt - 2XL", price_id: "price_1UYuFRPPjEaGGXHQ5duaCcki", price_cents: 5000, size: "2XL" },
    "last7-tee-3xl":   { product: "last7-tee",    name: "The Last 7 T-Shirt - 3XL", price_id: "price_1UYuFRPPjEaGGXHQ5duaCcki", price_cents: 5000, size: "3XL" },
    "last7-hoodie":    { product: "last7-hoodie", name: "The Last 7 Hoodie",       price_id: "price_1UYuG5PPjEaGGXHQbtoPcu2f", price_cents: 7500, size: "" },
    "last7-hoodie-xs": { product: "last7-hoodie", name: "The Last 7 Hoodie - XS",  price_id: "price_1UYuG5PPjEaGGXHQbtoPcu2f", price_cents: 7500, size: "XS" },
    "last7-hoodie-s":  { product: "last7-hoodie", name: "The Last 7 Hoodie - S",   price_id: "price_1UYuG5PPjEaGGXHQbtoPcu2f", price_cents: 7500, size: "S" },
    "last7-hoodie-m":  { product: "last7-hoodie", name: "The Last 7 Hoodie - M",   price_id: "price_1UYuG5PPjEaGGXHQbtoPcu2f", price_cents: 7500, size: "M" },
    "last7-hoodie-l":  { product: "last7-hoodie", name: "The Last 7 Hoodie - L",   price_id: "price_1UYuG5PPjEaGGXHQbtoPcu2f", price_cents: 7500, size: "L" },
    "last7-hoodie-xl": { product: "last7-hoodie", name: "The Last 7 Hoodie - XL",  price_id: "price_1UYuG5PPjEaGGXHQbtoPcu2f", price_cents: 7500, size: "XL" },
    "last7-hoodie-2xl": { product: "last7-hoodie", name: "The Last 7 Hoodie - 2XL", price_id: "price_1UYuG5PPjEaGGXHQbtoPcu2f", price_cents: 7500, size: "2XL" },
    "last7-hoodie-3xl": { product: "last7-hoodie", name: "The Last 7 Hoodie - 3XL", price_id: "price_1UYuG5PPjEaGGXHQbtoPcu2f", price_cents: 7500, size: "3XL" }
  };
  var FALLBACK = "/store";
  var link = document.getElementById("manual-link");
  var statusEl = document.getElementById("status-line");
  function goToStore() {
    if (link) { link.href = FALLBACK; link.textContent = "Back to the store"; }
    window.location.replace(FALLBACK);
  }
  var items = [];
  try {
    var products = new URLSearchParams(window.location.search).get("products") || "";
    var byId = {};
    products.split(",").forEach(function (pair) {
      var parts = pair.split(":");
      var id = (parts[0] || "").trim().toLowerCase();
      if (!PRODUCTS[id]) return;
      var qty = parseInt(parts[1], 10);
      if (isNaN(qty) || qty < 1) qty = 1;
      if (byId[id]) { byId[id].quantity += qty; }
      else {
        byId[id] = { product: PRODUCTS[id].product, price_id: PRODUCTS[id].price_id,
                     name: PRODUCTS[id].name, size: PRODUCTS[id].size,
                     price_cents: PRODUCTS[id].price_cents, quantity: qty };
        items.push(byId[id]);
      }
    });
  } catch (e) { items = []; }
  if (items.length === 0) { goToStore(); return; }
  // Render the order summary on the page itself, BEFORE the webhook call,
  // so the items, quantities and subtotal are visible here (Meta's checkout
  // validation reads this page, not just the Stripe session it redirects to).
  (function renderSummary() {
    var section = document.getElementById("order-summary");
    var list = document.getElementById("summary-items");
    var subtotalEl = document.getElementById("summary-subtotal");
    if (!section || !list || !subtotalEl) return;
    function money(cents) { return "$" + (cents / 100).toFixed(2); }
    var subtotal = 0;
    items.forEach(function (item) {
      var lineTotal = item.price_cents * item.quantity;
      subtotal += lineTotal;
      var row = document.createElement("div");
      row.className = "summary-item";
      var left = document.createElement("div");
      var nameEl = document.createElement("div");
      nameEl.className = "item-name";
      nameEl.textContent = item.name;
      var detailEl = document.createElement("div");
      detailEl.className = "item-detail";
      detailEl.textContent = "Quantity: " + item.quantity + " \u00d7 " + money(item.price_cents) + " each";
      left.appendChild(nameEl);
      left.appendChild(detailEl);
      var totalEl = document.createElement("div");
      totalEl.className = "item-total";
      totalEl.textContent = money(lineTotal);
      row.appendChild(left);
      row.appendChild(totalEl);
      list.appendChild(row);
    });
    subtotalEl.textContent = money(subtotal);
    section.hidden = false;
  })();
  if (statusEl) { statusEl.textContent = "Contacting secure checkout\u2026 this can take a few seconds."; }
  fetch(CHECKOUT_WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ items: items })
  })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data && data.checkout_url) {
        if (link) { link.href = data.checkout_url; }
        window.location.href = data.checkout_url;
        return;
      }
      throw new Error("no checkout_url");
    })
    .catch(function () {
      if (statusEl) { statusEl.textContent = "Something went wrong \u2014 please try again or head back to the store."; }
      if (link) { link.href = FALLBACK; link.textContent = "Back to the store"; }
    });
})();
</script>
</body>
</html>
