<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Checkout — Gray Code Entertainment</title>
<link rel="canonical" href="https://graycodeenterprise.net/checkout" />
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f4f4; color: #111; }
  header { background: #000; color: #fff; padding: 16px 20px; font-weight: 800; letter-spacing: 1px; font-size: 15px; }
  main { max-width: 560px; margin: 0 auto; padding: 72px 20px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { color: #555; line-height: 1.5; }
  a.checkout-link { display: inline-block; margin-top: 20px; background: #c9a227; color: #111; font-weight: 700; text-decoration: none; padding: 12px 24px; border-radius: 6px; }
  a.checkout-link:hover { background: #d9b73a; }
</style>
</head>
<body>
<header>GRAY CODE ENTERPRISE</header>
<main>
  <h1>Taking you to checkout...</h1>
  <p>If you are not redirected automatically, tap the button below.</p>
  <a class="checkout-link" id="manual-link" href="/store">Continue to checkout</a>
  <noscript><p><a href="/store">Continue to the store</a></p></noscript>
</main>
<script>
(function () {
  // Meta Commerce sends ?products=<id>:<qty>,<id>:<qty> — same format as
  // Meta's sample checkout controller. Stripe payment links are single
  // product checkouts, so we send the buyer to the first recognized product.
  var LINKS = {
    "last7-tee": "https://buy.stripe.com/aFa6oJ4FD68o71TgVa1Jm00",
    "last7-hoodie": "https://buy.stripe.com/28E7sN6NLfIYdqh8oE1Jm01"
  };
  var FALLBACK = "/store";
  var target = FALLBACK;
  try {
    var products = new URLSearchParams(window.location.search).get("products") || "";
    var pairs = products.split(",");
    for (var i = 0; i < pairs.length; i++) {
      var id = (pairs[i].split(":")[0] || "").trim().toLowerCase();
      if (LINKS[id]) { target = LINKS[id]; break; }
    }
  } catch (e) { target = FALLBACK; }
  var link = document.getElementById("manual-link");
  if (link) { link.href = target; }
  setTimeout(function () { window.location.replace(target); }, 600);
})();
</script>
</body>
</html>
